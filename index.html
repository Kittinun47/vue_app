<template>
  <div style="font-family: sans-serif; margin: 30px;">
    
    <!-- ส่วนที่ 1: ระบบตัดเกรด (ใช้อ้างอิง v-if) -->
    <div style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; width: 400px;">
      <h2>ระบบตัดเกรด</h2>
      
      <!-- Input สำหรับรับคะแนน -->
      <input type="number" v-model="score" placeholder="กรอกคะแนน" />

      <!-- ปุ่มคำนวณเกรด -->
      <button @click="calculateGrade">คำนวณเกรด</button>

      <!-- แสดงผลลัพธ์เกรด -->
      <p v-if="grade !== ''">เกรดของคุณ: {{ grade }}</p>

      <!-- แสดงข้อความแจ้งเตือนเมื่อมีข้อผิดพลาด -->
      <p v-if="errorMessage" style="color: red;">{{ errorMessage }}</p>
    </div>

    <!-- ส่วนที่ 2: รายการสินค้า (ใช้อ้างอิง v-for) -->
    <div style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 400px;">
      <h2>รายการสินค้า:</h2>
      <ul>
        <li v-for="(product, index) in products" :key="product.id || index">
          {{ index + 1 }}. {{ product.name }} - ราคา: {{ product.price }} บาท (คงเหลือ: {{ product.num }})
        </li>
      </ul>
    </div>

  </div>
</template>

<script>
export default {
  data() {
    return {
      // ตัวแปรสำหรับระบบตัดเกรด
      score: '',       // เก็บค่าคะแนนจากผู้ใช้
      grade: '',       // เก็บผลลัพธ์เกรดที่คำนวณได้
      errorMessage: '', // ข้อความแจ้งเตือนเมื่อเกิดข้อผิดพลาด

      // ตัวแปรสำหรับระบบแสดงรายการสินค้า (v-for)
      products: [
        { id: 1, name: 'สินค้า 1', price: 100, num: 20 },
        { id: 2, name: 'สินค้า 2', price: 200, num: 20 },
        { id: 3, name: 'สินค้า 3', price: 300, num: 20 },
      ]
    }
  },
  methods: {
    calculateGrade() {
      // ตรวจสอบว่าผู้ใช้กรอกคะแนนหรือไม่
      if (this.score === '') {
        this.errorMessage = 'กรุณากรอกคะแนนก่อนคำนวณ';
        this.grade = ''; 
        return;
      }
      
      // แปลง score เป็นตัวเลข
      const scoreNum = Number(this.score);

      // ตรวจสอบว่าคะแนนเกิน 100 หรือไม่
      if (scoreNum > 100) {
        this.errorMessage = 'กรุณากรอกคะแนนให้ถูกต้อง (0-100)';
        this.grade = ''; 
        return;
      }

      // รีเซ็ตข้อความแจ้งเตือน
      this.errorMessage = '';

      // ตรวจสอบคะแนนและกำหนดเกรด
      if (scoreNum >= 80) {
        this.grade = 'A';
      } else if (scoreNum >= 70) {
        this.grade = 'B';
      } else if (scoreNum >= 60) {
        this.grade = 'C';
      } else if (scoreNum >= 50) {
        this.grade = 'D';
      } else {
        this.grade = 'F';
      }
    }
  }
}
</script>

<style scoped>
/* สไตล์เพิ่มเติม */
input, button {
  margin: 5px;
  padding: 8px;
  font-size: 16px;
}
